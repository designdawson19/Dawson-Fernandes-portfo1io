<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Edit portfolio</title>
<style>
:root{--bg:#dfe1de;--ink:#20252b;--mute:#5d666e;--line:#b7bcb9;--acc:#2a45e0;--tile:#cdd1ce;
box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181c20;--ink:#e6e8e5;--mute:#98a1a8;--line:#333a40;--acc:#8095ff;--tile:#22282d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 system-ui,sans-serif}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.box{max-width:460px;margin:8vh auto;padding:0 1rem}
h1{font-size:1.5rem;margin:0 0 .5rem}
label{display:block;margin:0 0 .9rem;font-weight:600;font-size:.9rem}
input,textarea{display:block;width:100%;margin-top:.25rem;padding:.55rem .6rem;font:inherit;font-weight:400;color:inherit;background:var(--tile);border:1px solid var(--line);border-radius:3px}
button{font:600 .9rem system-ui;padding:.5rem .9rem;border-radius:3px;border:1px solid var(--line);background:none;color:inherit;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.mute{color:var(--mute);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.bar b{margin-right:auto}
.lay{display:grid;grid-template-columns:230px 1fr;gap:1.5rem;padding:1rem;max-width:1000px;margin:0 auto}
#list{display:flex;flex-direction:column;gap:.35rem;align-items:stretch}
#list button{text-align:left}
#list button.on{border-color:var(--acc);color:var(--acc)}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin:.2rem 0 1rem}
@media(max-width:720px){.lay{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box" id="login">
  <h1>Edit portfolio</h1>
  <p class="mute">Connect to the GitHub repo that hosts this site. Your token stays in this browser only.</p>
  <label>GitHub username<input id="owner" autocomplete="off"></label>
  <label>Repository name<input id="repo" autocomplete="off"></label>
  <label>Branch<input id="branch" value="main"></label>
  <label>Access token<input id="token" type="password" autocomplete="off"></label>
  <button class="p" onclick="connect()">Connect</button>
  <p class="mute" id="err" role="alert"></p>
  <p class="mute">Create the token at GitHub, Settings, Developer settings, Fine-grained tokens. Give it access to this one repo with Contents set to Read and write.</p>
</div>
<div id="ed" hidden>
  <div class="bar"><b>Portfolio editor</b><span class="mute" id="st" role="status"></span><a class="mute" href="index.html" target="_blank">View site</a><button class="p" onclick="save()">Save changes</button></div>
  <div class="lay"><nav id="list" aria-label="Projects"></nav><form id="form" onsubmit="return false"></form></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const host=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
const path1=location.pathname.split('/')[1]||'';
const F0={owner:host,repo:path1.includes('.')?'':path1,branch:'main',token:''};
Object.keys(F0).forEach(k=>$('#'+k).value=ls.get(k)||F0[k]);
let C,sha,D,cur=0;
const status=t=>$('#st').textContent=t;
const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const api=(p,o={})=>fetch(`https://api.github.com/repos/${C.owner}/${C.repo}/contents/${p}`,{...o,headers:{Authorization:'Bearer '+C.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}})
 .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j});
async function connect(){C={};Object.keys(F0).forEach(k=>C[k]=$('#'+k).value.trim());
 try{const j=await api('content.json?ref='+encodeURIComponent(C.branch));sha=j.sha;
  D=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));
  Object.keys(F0).forEach(k=>ls.set(k,C[k]));$('#login').hidden=true;$('#ed').hidden=false;draw()}
 catch(e){$('#err').textContent='Could not connect: '+e.message+'. Check the username, repo name and token.'}}
async function save(){status('Saving…');
 D.projects.forEach(p=>{if(/^project-\d+$/.test(p.id))p.id=slug(p.title)||p.id});
 try{const j=await api('content.json',{method:'PUT',body:JSON.stringify({message:'Update portfolio',branch:C.branch,sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2))))})});
  sha=j.content.sha;status('Saved. It goes live in about a minute.')}catch(e){status('Save failed: '+e.message)}}
async function up(file){
 const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
 const name='images/'+Date.now()+'-'+slug(file.name.replace(/\.[^.]+$/,''))+'.jpg';
 await api(name,{method:'PUT',body:JSON.stringify({message:'Add image',branch:C.branch,content:c.toDataURL('image/jpeg',.85).split(',')[1]})});return name}
function pick(kind){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=kind=='images';
 i.onchange=async()=>{status('Uploading…');try{for(const f of i.files){const n=await up(f),p=D.projects[cur];if(kind=='cover')p.cover=n;else(p.images=p.images||[]).push(n)}
  status('Uploaded. Save changes to publish.');draw()}catch(e){status('Upload failed: '+e.message)}};i.click()}
const V=(o,k,t)=>{const v=o[k]??'';return t=='tags'?v.join(', '):t=='lines'?v.join('\n'):t=='links'?v.map(l=>l.label+' | '+l.url).join('\n'):v};
const Fd=(lab,o,k,{t='',s=0,a=0}={})=>`<label>${lab}${a?`<textarea rows="${a}" data-k="${k}" data-t="${t}" ${s?'data-s=1':''}>${esc(V(o,k,t))}</textarea>`:`<input value="${esc(V(o,k,t))}" data-k="${k}" data-t="${t}" ${s?'data-s=1':''}>`}</label>`;
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;let v=t.value;
 if(t.dataset.t=='tags')v=v.split(',').map(s=>s.trim()).filter(Boolean);
 if(t.dataset.t=='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);
 if(t.dataset.t=='links')v=v.split('\n').map(l=>l.split('|')).filter(a=>a[1]).map(a=>({label:a[0].trim(),url:a[1].trim()}));
 if(t.dataset.s)D.site[k]=v;else D.projects[cur][k]=v;
 if(k=='title'&&!t.dataset.s)$('#l'+cur).textContent=v||'Untitled'});
function draw(){const p=D.projects[cur],s=D.site;
 $('#list').innerHTML=D.projects.map((x,i)=>`<button class="${i==cur?'on':''}" onclick="cur=${i};draw()" id="l${i}">${esc(x.title||'Untitled')}</button>`).join('')
  +`<button onclick="add()">Add project</button><button class="${cur<0?'on':''}" onclick="cur=-1;draw()">About and contact</button>`;
 $('#form').innerHTML=cur<0||!p?
  Fd('Name',s,'name',{s:1})+Fd('Title',s,'title',{s:1})+Fd('Bio',s,'bio',{s:1,a:4})+Fd('Email',s,'email',{s:1})+Fd('Links (one per line: Label | https://url)',s,'links',{s:1,t:'links',a:4})
 :Fd('Title',p,'title')+Fd('Year',p,'year')+Fd('Category',p,'category')+Fd('One-line summary',p,'summary')+Fd('Tags (comma separated)',p,'tags',{t:'tags'})
  +Fd('Cover image path',p,'cover')+`<div class="acts"><button onclick="pick('cover')">Upload cover</button></div>`
  +Fd('Story (blank line starts a new paragraph)',p,'body',{a:10})+Fd('Gallery images (one path per line)',p,'images',{t:'lines',a:4})
  +`<div class="acts"><button onclick="pick('images')">Upload gallery images</button><button onclick="mv(-1)">Move up</button><button onclick="mv(1)">Move down</button><button onclick="del()">Delete project</button></div>`}
function add(){D.projects.unshift({id:'project-'+Date.now(),title:'New project',year:String(new Date().getFullYear()),category:'',summary:'',tags:[],cover:'',body:'',images:[]});cur=0;draw()}
function mv(d){const j=cur+d;if(j<0||j>=D.projects.length)return;[D.projects[cur],D.projects[j]]=[D.projects[j],D.projects[cur]];cur=j;draw()}
function del(){if(confirm('Delete this project? Save changes to make it permanent.')){D.projects.splice(cur,1);cur=Math.max(0,cur-1);draw()}}
</script>
</body>
</html>
